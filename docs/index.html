<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zonely</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #09090b;
    }

    main {
      width: min(100%, 520px);
      display: grid;
      gap: 22px;
    }

    .panel {
      display: grid;
      gap: 20px;
      padding: 24px;
      border: 1px solid #27272a;
      border-radius: 8px;
      background: #111113;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 52px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #a1a1aa;
      line-height: 1.55;
    }

    .meta {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid #27272a;
      border-radius: 8px;
      background: #18181b;
      color: #d4d4d8;
      font-size: 14px;
    }

    a.button {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
    }

    a.button[aria-disabled="true"] {
      pointer-events: none;
      background: #27272a;
      color: #71717a;
    }

    code {
      color: #bfdbfe;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div>
        <h1>Zonely</h1>
        <p>Android uygulamasinin son APK surumu.</p>
      </div>
      <div class="meta" id="meta">
        <span>Surum bilgisi yukleniyor...</span>
      </div>
      <a class="button" id="download" href="#" aria-disabled="true">APK indir</a>
    </section>
  </main>

  <script>
    const manifestUrl = "https://raw.githubusercontent.com/zonely-gen-tr/ZonelyMobile/main/updates/themes.json";
    const meta = document.getElementById("meta");
    const download = document.getElementById("download");

    fetch(manifestUrl, { cache: "no-store" })
      .then((response) => response.json())
      .then((manifest) => {
        const notes = Array.isArray(manifest.notes) ? manifest.notes.join("<br>") : String(manifest.notes || "");
        meta.innerHTML = [
          `<span>Surum: <strong>${manifest.versionName || "-"}</strong> (${manifest.versionCode || "-"})</span>`,
          manifest.sha256 ? `<span>SHA256: <code>${manifest.sha256}</code></span>` : "",
          notes ? `<span>${notes}</span>` : "",
        ].filter(Boolean).join("");

        if (manifest.apkUrl) {
          download.href = manifest.apkUrl;
          download.removeAttribute("aria-disabled");
        }
      })
      .catch(() => {
        meta.textContent = "Surum bilgisi alinamadi.";
      });
  </script>
</body>
</html>
