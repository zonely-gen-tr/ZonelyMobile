
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zonely Mobile</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #09090b;
    }

    main {
      width: min(100%, 760px);
      display: grid;
      gap: 22px;
    }

    .panel,
    .card {
      border: 1px solid #27272a;
      border-radius: 8px;
      background: #111113;
    }

    .panel {
      display: grid;
      gap: 12px;
      padding: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: contain;
      background: #18181b;
      border: 1px solid #27272a;
      padding: 6px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1;
      letter-spacing: 0;
    }

    h2 {
      font-size: 18px;
      letter-spacing: 0;
    }

    p,
    .muted {
      color: #a1a1aa;
      line-height: 1.55;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      display: grid;
      gap: 14px;
      padding: 18px;
      min-height: 220px;
    }

    .meta {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #27272a;
      border-radius: 8px;
      background: #18181b;
      color: #d4d4d8;
      font-size: 14px;
    }

    a.button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
    }

    a.button[aria-disabled="true"] {
      pointer-events: none;
      background: #27272a;
      color: #71717a;
    }

    code {
      color: #bfdbfe;
      word-break: break-all;
    }

    @media (max-width: 680px) {
      body {
        place-items: start center;
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="brand">
        <img class="logo" src="logo.png" alt="Zonely logo">
        <div>
          <h1>Zonely Mobile</h1>
          <p>Android APK and iOS release information.</p>
        </div>
      </div>
    </section>

    <section class="grid" aria-label="Platform downloads">
      <article class="card">
        <div>
          <h2>Android</h2>
        </div>
        <div class="meta" id="android-meta">
          <span>Loading version information...</span>
        </div>
        <a class="button" id="android-download" href="#" aria-disabled="true">Download APK</a>
      </article>

      <article class="card">
        <div>
          <h2>iOS</h2>
        </div>
        <div class="meta" id="ios-meta">
          <span>Loading iOS information...</span>
        </div>
        <a class="button" id="ios-download" href="#" aria-disabled="true">iOS is being prepared</a>
      </article>
    </section>
  </main>

  <script>
    const manifestUrl = "https://raw.githubusercontent.com/zonely-gen-tr/ZonelyMobile/main/updates/themes.json";
    const androidMeta = document.getElementById("android-meta");
    const androidDownload = document.getElementById("android-download");
    const iosMeta = document.getElementById("ios-meta");
    const iosDownload = document.getElementById("ios-download");

    function clean(value) {
      return value == null ? "" : String(value);
    }

    function notesHtml(notes) {
      if (Array.isArray(notes)) return notes.map(clean).filter(Boolean).join("<br>");
      return clean(notes);
    }

    fetch(manifestUrl, { cache: "no-store" })
      .then((response) => response.json())
      .then((manifest) => {
        const platforms = manifest.platforms || {};
        const android = platforms.android || {};
        const ios = platforms.ios || {};
        const androidVersionName = android.versionName || manifest.versionName || "-";
        const androidVersionCode = android.versionCode || manifest.versionCode || "-";
        const androidSha = android.sha256 || manifest.sha256 || "";
        const androidUrl = android.downloadUrl || manifest.apkUrl || "";
        const androidNotes = notesHtml(android.notes || manifest.notes);

        androidMeta.innerHTML = [
          `<span>Version: <strong>${androidVersionName}</strong> (${androidVersionCode})</span>`,
          androidSha ? `<span>SHA256: <code>${androidSha}</code></span>` : "",
          androidNotes ? `<span>${androidNotes}</span>` : "",
        ].filter(Boolean).join("");

        if (androidUrl) {
          androidDownload.href = androidUrl;
          androidDownload.removeAttribute("aria-disabled");
        }

        const iosAvailable = ios.available === true && ios.downloadUrl;
        const iosNotes = notesHtml(ios.notes);
        iosMeta.innerHTML = [
          `<span>Status: <strong>${iosAvailable ? "Ready" : "In preparation"}</strong></span>`,
          ios.versionName ? `<span>Version: <strong>${ios.versionName}</strong></span>` : "",
          ios.channel ? `<span>Channel: ${clean(ios.channel)}</span>` : "",
          iosNotes ? `<span>${iosNotes}</span>` : "",
        ].filter(Boolean).join("");

        if (iosAvailable) {
          iosDownload.href = ios.downloadUrl;
          iosDownload.textContent = ios.type === "ipa" ? "Download IPA" : "Open iOS";
          iosDownload.removeAttribute("aria-disabled");
        }
      })
      .catch(() => {
        androidMeta.textContent = "Version information could not be retrieved.";
        iosMeta.textContent = "iOS information could not be retrieved.";
      });
  </script>
</body>
</html>
