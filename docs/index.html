<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zonely APK İndir</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    p {
      margin: 0 0 20px;
      color: #bbb;
    }

    .meta {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #ddd;
      text-align: left;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .button[aria-disabled="true"] {
      background: #555;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="https://raw.githubusercontent.com/zonely-gen-tr/ZonelyMobile/refs/heads/main/docs/logo.png" alt="Zonely logosu">
    <h1>Zonely</h1>
    <p>Android uygulamasının en son APK sürümü</p>

    <div class="meta" id="meta">Sürüm bilgisi yükleniyor...</div>

    <a id="download" class="button" href="#" aria-disabled="true">APK indir</a>
  </div>

  <script>
    const manifestUrl = "https://raw.githubusercontent.com/zonely-gen-tr/ZonelyMobile/main/updates/themes.json";
    const meta = document.getElementById("meta");
    const download = document.getElementById("download");

    fetch(manifestUrl, { cache: "no-store" })
      .then(res => res.json())
      .then(manifest => {
        const notes = Array.isArray(manifest.notes) ? manifest.notes.join("\n") : manifest.notes || "";
        meta.innerHTML = `Sürüm: <strong>${manifest.versionName || "-"}</strong> (${manifest.versionCode || "-"})<br>${notes}`;

        if (manifest.apkUrl) {
          download.href = manifest.apkUrl;
          download.removeAttribute("aria-disabled");
        }
      })
      .catch(() => {
        meta.textContent = "Sürüm bilgisi alınamadı.";
      });
  </script>
</body>
</html>
